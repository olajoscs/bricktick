name: bricktick

services:
  mysql:
    image: mysql:8.4
    container_name: bricktick-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - appnet

  php:
    build:
      context: .
      dockerfile: infra/php/Dockerfile
    container_name: bricktick-php
    environment:
      APP_ENV: local
      PHP_IDE_CONFIG: serverName=bricktick
      XDEBUG_MODE: debug,develop
      XDEBUG_CONFIG: client_host=host.docker.internal client_port=9003 idekey=CURSOR
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./src/backend:/var/www/html
    depends_on:
      - mysql
    networks:
      - appnet

  nginx:
    image: nginx:1.27-alpine
    container_name: bricktick-nginx
    ports:
      - "8080:80"
    volumes:
      - ./src/backend:/var/www/html:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - appnet

  frontend:
    image: node:20-alpine
    container_name: bricktick-frontend
    environment:
      VITE_API_PROXY_TARGET: http://nginx:80
      # Used by the browser (host machine), not the container loopback
      VITE_API_BASE_URL: http://localhost:8080
    working_dir: /app
    command: >
      sh -lc "if [ -f package.json ];
      then npm install && npm run dev -- --host 0.0.0.0 --port 5173;
      else echo 'No frontend yet (create src/frontend/package.json)'; tail -f /dev/null; fi"
    ports:
      - "5173:5173"
    volumes:
      - ./src/frontend:/app
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  mysql_data:

